<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub & Git 文青實證互動學習誌 (GitHub Learning)</title>
  <meta name="description" content="典雅文青風格、全景學習流程圖、具備三層官方權威證據鏈、新手迷航導航、Gemini AI 隨身助教與實作驗證模式 (Verify Mode) 的 Git / GitHub 雙軌互動學習網站。">
  <!-- Google Fonts: 繁體中文文青書寫 (Noto Serif TC + Noto Sans TC + Fira Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <span class="brand-icon">🖋️</span>
          <div>
            <div class="brand-title">Git 實證學習誌</div>
            <span class="badge-official">Literary & Gemini AI</span>
          </div>
        </div>
      </div>

      <!-- Search Input -->
      <div class="sidebar-search">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="sidebar-search-input" class="search-input" placeholder="搜尋章節、名詞或指令..." aria-label="搜尋課程">
        </div>
      </div>

      <!-- Navigation List -->
      <nav class="sidebar-nav" id="sidebar-nav-container">
        <!-- Dynamically rendered via app.js -->
      </nav>
    </aside>

    <!-- Main Wrapper -->
    <main class="main-wrapper">
      <!-- Top Sticky Header -->
      <header class="top-header">
        <div class="header-progress">
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-bar-fill"></div>
          </div>
          <span class="progress-text" id="progress-text">學習步履: 0%</span>
        </div>

        <div class="header-actions">
          <button class="btn-secondary" onclick="window.roadmapEngine.toggle(true)" style="padding: 8px 18px; font-size: 0.85rem; font-family: var(--font-heading);">
            🗺️ 學習流程圖
          </button>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <div class="content-container" id="main-content-area">
        <!-- Rendered dynamically by app.js -->
      </div>
    </main>
  </div>

  <!-- JavaScript Core Engine Scripts -->
  <script src="./js/lessonsData.js"></script>
  <script src="./js/progress.js"></script>
  <script src="./js/verify.js"></script>
  <script src="./js/quiz.js"></script>
  <script src="./js/roadmap.js"></script>
  <script src="./js/gemini-tutor.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
